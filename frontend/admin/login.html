<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../../assets/css/login.css">
</head>

<body>

    <main class="login">
        <form class="login__form" id="loginForm" novalidate>
            <h1>Iniciar sesión</h1>
            <p class="login__sub">Ingresa tus datos para continuar</p>

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <div class="login__pass">
                <input type="password" id="password" name="password" placeholder="Tu contraseña"
                    autocomplete="current-password" required>
                <button type="button" id="toggle" aria-label="Mostrar contraseña">Mostrar</button>
            </div>

            <p class="login__error" id="error" role="alert"></p>

            <button type="submit" class="login__btn">Entrar</button>
        </form>
    </main>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/login.js"></script>
</body>

</html>
